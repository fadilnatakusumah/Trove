name: CI

# Every push to a long-lived branch and every PR. This is the gate that catches
# a regression before it reaches a release tag.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast checks first: a formatting or lint failure should fail the run in
  # seconds, not after a full compile.
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      # Clippy is allowed to look at test code too (`--all-targets`), since the
      # test suites are the ones guarding filesystem safety.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # The safety-critical suite. It runs on all three platforms because the
  # filesystem layer is where platform differences actually bite: Windows
  # verbatim `\\?\` paths, separator handling, and the trash API all behave
  # differently per OS.
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri's build script needs the webkit dev headers even to type-check
      # the crate on Linux.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
