name: CI

# Every push to a long-lived branch and every PR. This is the gate that catches
# a regression before it reaches a release tag.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks only, so a formatting or lint typo fails in seconds instead of
  # after a full compile. Deliberately no Rust *compile* here — see `clippy`.
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # `npm run lint` rather than a hand-written eslint invocation: the script
      # is the single definition of "lint this project", so CI and a developer's
      # terminal can never disagree about what it checks.
      - name: ESLint
        run: npm run lint

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rustfmt parses but does not compile, so it needs no system libraries.
      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

  # Split from `lint` because clippy *does* compile the crate, and on Linux
  # that needs GTK/WebKit development headers. Omitting them fails deep inside
  # a dependency's build script (`gdk-sys` cannot find `gdk-3.0` via
  # pkg-config) with an error that says nothing about the missing package.
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # `--all-targets` includes the test suites, which are the ones guarding
      # filesystem safety. `-D warnings` makes clippy a gate, not a suggestion.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # The safety-critical suite. It runs on all three platforms because the
  # filesystem layer is where platform differences actually bite: Windows
  # verbatim `\\?\` paths, separator handling, and the trash API all behave
  # differently per OS.
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri's build script needs the webkit dev headers even to type-check
      # the crate on Linux.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
