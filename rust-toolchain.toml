# Pinned so `cargo` behaves identically for a developer and for CI.
#
# Without this, "stable" means different things in different places: a local
# toolchain that has not been updated for a while is not the same compiler as
# the one a fresh runner installs. Clippy lints are added in new releases, so
# that drift shows up as a clean local run and a failing CI run — which is
# exactly what happened with `clippy::unnecessary_sort_by`, a lint that did not
# exist in the older local toolchain.
#
# Bumping this is a deliberate act: change the version here, run the full suite
# locally, and let CI confirm.
#
# Note this is newer than the `rust-version` in Cargo.toml, which declares the
# minimum a downstream build may use. This file pins what *we* build with.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
