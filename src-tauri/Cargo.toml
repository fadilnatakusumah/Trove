[package]
name = "agent-manager"
version = "0.1.0"
description = "Local AI agent environment manager"
authors = ["Trove"]
license = "UNLICENSED"
repository = "https://github.com/fadilnatakusumah/Trove"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
dirs = "7.0.0"
trash = "5.2.9"
tempfile = "3.27.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tokio = "1.53.2"
